<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>揭棋 · jqe</title>
<style>
:root {
  --bg: #f3efe7; --panel: #fffdf9; --ink: #2a241c; --muted: #7b7163; --line: #dcd3c3; --accent: #9b3b24;
  --wood: #e6c489; --wood-edge: #b98a4a; --grid: #5a3b1c; --disc: #f6e7c8; --disc-edge: #7a5a32;
  --red: #b3261e; --black: #1d1b19; --back-red: #a8342a; --back-black: #33302c; --target: #2e7d4f; --last: #d98a00;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1916; --panel: #25221e; --ink: #ece5d8; --muted: #a39a8b; --line: #3a352e; --accent: #e08a6d; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; height: 100%; padding: 16px; max-width: 1180px; margin: 0 auto; }
#boardwrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; gap: 8px; }
#board { width: min(100%, calc((100vh - 32px) * 572 / 640)); height: auto; max-height: calc(100vh - 32px); display: block;
  border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .22); user-select: none; -webkit-user-select: none; }
aside { display: flex; flex-direction: column; gap: 10px; min-height: 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px; }
aside header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
.clock { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border: 1px solid var(--line);
  border-radius: 8px; font-variant-numeric: tabular-nums; }
.clock .who { display: flex; align-items: center; gap: 8px; }
.clock .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--disc-edge); }
.clock .dot.red { background: var(--red); } .clock .dot.black { background: var(--black); }
.clock .time { font-size: 24px; font-weight: 600; }
.clock.running { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.clock .time.low { color: var(--red); }
#status { min-height: 1.5em; font-weight: 600; }
#status.over { color: var(--accent); }
#pools { font-size: 13px; color: var(--muted); }
#pools table { border-collapse: collapse; width: 100%; }
#pools td { padding: 1px 0; white-space: nowrap; }
#pools td.lab { width: 1%; padding-right: 10px; }
#pools .pc { display: inline-block; min-width: 2.6em; color: var(--ink); }
#pools .pc.zero { opacity: .32; }
#pools .pc b { font-weight: 600; } #pools .pc.red b { color: var(--red); }
#pools .pc.unknown { color: var(--muted); }
#pools .none { color: var(--muted); opacity: .6; }
#moves { flex: 1 1 120px; min-height: 80px; overflow-y: auto; margin: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
  list-style: none; font-variant-numeric: tabular-nums; font-size: 13.5px; }
#moves li { display: grid; grid-template-columns: 2.4em 1fr 1fr; gap: 4px; padding: 1px 0; }
#moves .n { color: var(--muted); }
#moves .rv { color: var(--accent); }
#think { font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; overflow-wrap: anywhere; }
#think b { color: var(--ink); font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.opt { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
label.opt.big { font-size: 15px; color: var(--ink); }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; background: var(--panel); color: var(--ink); width: min(460px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog h2 { margin: 0 0 12px; font-size: 18px; }
fieldset { border: 0; padding: 0; margin: 0 0 14px; }
legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
.choices { display: flex; gap: 14px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
input[type=number] { font: inherit; width: 6.5em; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.presets button { padding: 3px 9px; font-size: 13px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
#err { color: var(--red); min-height: 1.2em; font-size: 13px; }
/* board */
.grid line, .grid path { stroke: var(--grid); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.coord { fill: var(--grid); font-size: 12px; opacity: .7; }
.river { fill: var(--grid); font-size: 22px; opacity: .35; letter-spacing: .5em; }
.pc circle.body { fill: var(--disc); stroke: var(--disc-edge); stroke-width: 2; }
.pc circle.ring { fill: none; stroke-width: 1.2; }
.pc.red circle.ring { stroke: var(--red); } .pc.black circle.ring { stroke: var(--black); }
.pc text { font-size: 28px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pc.red text { fill: var(--red); } .pc.black text { fill: var(--black); }
.pc.down.red circle.body { fill: var(--back-red); } .pc.down.black circle.body { fill: var(--back-black); }
.pc.down circle.ring { stroke: rgba(255, 255, 255, .55); stroke-dasharray: 3 4; }
.pc.down text { fill: rgba(255, 255, 255, .92); font-size: 22px; }
.pc.sel circle.body { stroke: var(--target); stroke-width: 4; }
.pc.checked circle.body { stroke: var(--red); stroke-width: 4; }
.mark-last { fill: none; stroke: var(--last); stroke-width: 3; }
.mark-pend { fill: none; stroke: #6fd3c0; stroke-width: 3; stroke-dasharray: 7 5; opacity: .95; }
.mark-pend-line { stroke: #6fd3c0; stroke-width: 2; stroke-dasharray: 4 7; opacity: .55; }
.target { fill: var(--target); opacity: .8; }
.target.cap { fill: none; stroke: var(--target); stroke-width: 4; opacity: .9; }
.hit { fill: transparent; cursor: pointer; }
/* 摆棋 / 选身份 */
#palette { margin-top: 10px; width: min(100%, 572px); display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
#palette-grid { display: grid; gap: 6px; }
#palette-grid .prow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#palette-grid button { min-width: 2.6em; padding: 4px 6px; }
/* 棋盒里按棋子本色上色：红子红字、黑子黑字。深色面板上纯黑字看不清，
   所以给棋子按钮铺一层「棋子面」那样的浅底，字色就能照棋子的颜色来。 */
#palette-grid button.red,
#palette-grid button.black {
  background: #f7ecd8; border-color: #d8bb91; font-weight: 600; font-size: 15px;
}
#palette-grid button.red { color: #b5342a; }
#palette-grid button.black { color: #1a1512; }
#palette-grid button.dark { background: #efe2c8; border-style: dashed; }
#palette-grid button.erase { color: var(--muted); }
#palette-grid button.big { min-width: 0; padding: 8px 18px; font-size: 15px; border-radius: 10px; }
#palette-grid button.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224, 138, 109, .6); }
#fen { width: 100%; box-sizing: border-box; margin-top: 6px; font: 12px/1.45 ui-monospace, Consolas, monospace; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
#pick { width: min(100%, 572px); box-sizing: border-box; border: 1px solid var(--accent); border-radius: 10px;
  padding: 12px 14px; background: var(--panel); box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
#pick[hidden] { display: none; }
#pick .pickhead { display: flex; flex-direction: column; gap: 4px; }
#pick h3 { margin: 0; font-size: 15px; color: var(--accent); }
#pickgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
#pickgrid button { padding: 9px 6px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink);
  font: inherit; cursor: pointer; }
#pickgrid button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
#pickgrid button:disabled { opacity: .35; cursor: default; }
#pick .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; height: auto; }
  #board { width: 100%; max-height: none; }
  #moves { max-height: 220px; }
}
</style>
</head>
<body>
<main>
  <section id="boardwrap">
    <svg id="board" viewBox="0 0 572 640" role="img" aria-label="揭棋棋盘"></svg>
    <div id="pick" hidden>
      <div class="pickhead">
        <h3 id="picktitle">这一步翻开的暗子是什么？</h3>
      </div>
      <div class="choices" id="pickgrid"></div>
      <div class="row" style="justify-content:flex-end;margin-top:10px">
        <button type="button" id="pick-auto">随机</button>
        <button type="button" id="pick-cancel">取消</button>
      </div>
    </div>
    <div id="palette" hidden>
      <div class="row" id="palette-grid"></div>
      <div class="row">
        <select id="edit-turn" aria-label="谁先走"><option value="w">红方先走</option><option value="b">黑方先走</option></select>
        <button id="btn-edit-clear">清空</button>
        <button id="btn-edit-std">标准开局</button>
        <button id="btn-edit-cancel">取消</button>
        <button id="btn-edit-done" class="primary">用这个局面</button>
      </div>
      <p class="hint" id="edithint">点上面的棋子，再点棋盘落子；「删除棋子」可以擦掉。X = 红暗子，x = 黑暗子。</p>
    </div>
  </section>
  <aside>
    <header><h1>揭棋对战</h1></header>
    <div class="clock" id="clk-top"><span class="who"><span class="dot"></span><span class="name"></span></span><span class="time"></span></div>
    <div id="status" aria-live="polite">连接中…</div>
    <div id="pools"></div>
    <ol id="moves" aria-label="着法记录"></ol>
    <div id="think" hidden></div>
    <div class="clock" id="clk-bot"><span class="who"><span class="dot"></span><span class="name"></span></span><span class="time"></span></div>
    <div class="row">
      <button id="btn-new" class="primary">新对局</button>
      <button id="btn-resign">认输</button>
      <button id="btn-undo" title="悔棋：撤回你和 jqe 各一步（快捷键 U）">悔棋</button>
      <button id="btn-flip" title="翻转棋盘（快捷键 F）">翻转</button>
    </div>
    <label class="opt"><input type="checkbox" id="opt-think"> 显示引擎的思考</label>
  </aside>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2>新对局</h2>
    <fieldset>
      <legend>你执</legend>
      <div class="choices">
        <label><input type="radio" name="human" value="red" checked> 红方（先手）</label>
        <label><input type="radio" name="human" value="black"> 黑方</label>
        <label><input type="radio" name="human" value="random"> 随机</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>时间</legend>
      <div class="grid2">
        <label><input type="radio" name="mode" value="clock"> 对局钟</label>
        <span><input type="number" id="base" min="0.5" max="600" step="0.5" value="15" aria-label="整局分钟数"> 分 + <input type="number" id="inc" min="0" max="300" step="1" value="10" aria-label="每步加秒"> 秒</span>
        <span></span>
        <span class="presets row"><button type="button" data-b="5" data-i="3">5+3</button><button type="button" data-b="15" data-i="10">15+10</button><button type="button" data-b="30" data-i="20">30+20</button><button type="button" data-b="60" data-i="30">60+30</button></span>
        <label><input type="radio" name="mode" value="movetime" checked> 引擎固定每步思考</label>
        <span><input type="number" id="movetime" min="0.1" max="3600" step="0.1" value="5" aria-label="引擎每步思考秒数"> 秒</span>
      </div>
    </fieldset>
    <fieldset>
      <legend>引擎</legend>
      <div class="grid2">
        <label for="threads">线程</label><input type="number" id="threads" min="1" max="64" step="1" value="4">
        <label for="hash">哈希（MB）</label><input type="number" id="hash" min="16" max="16384" step="16" value="1024">
        <span></span><label><input type="checkbox" id="ponder" checked> 引擎始终思考</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>初始局面</legend>
      <div class="choices">
        <label><input type="radio" name="start" value="std"> 标准开局</label>
        <label><input type="radio" name="start" value="custom" checked> 自定义</label>
      </div>
      <div id="customrow">
        <textarea id="fen" rows="2" spellcheck="false" aria-label="初始局面 FEN"></textarea>
      </div>
      <label class="opt big" style="margin-top:8px"><input type="checkbox" id="manual" checked> 用户指定棋子</label>
    </fieldset>
    <div id="err"></div>
    <div class="row" style="justify-content:flex-end">
      <button type="button" id="dlg-cancel">取消</button>
      <button type="button" id="dlg-edit">在棋盘上摆子</button>
      <button type="submit" class="primary" id="dlg-start">开始</button>
    </div>
  </form>
</dialog>


<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg', CELL = 60, MX = 46, MY = 40, W = 572, H = 640;  // 8 x 9 cells, room for the labels
const ZH = {K: '帥', A: '仕', B: '相', R: '俥', N: '傌', C: '炮', P: '兵', k: '將', a: '士', b: '象', r: '車', n: '馬', c: '砲', p: '卒'};
const NAME = {K: '帅', A: '仕', B: '相', R: '俥', N: '傌', C: '炮', P: '兵'};
const KINDS = ['R', 'N', 'C', 'B', 'A', 'P'];
const $ = id => document.getElementById(id);
const svg = $('board');
let S = null, sel = null, recvAt = 0, sending = false, shownMoves = -1;

function load(key, dflt) { try { const v = localStorage.getItem('jqe.' + key); return v === null ? dflt : v === '1'; } catch (e) { return dflt; } }
function save(key, on) { try { localStorage.setItem('jqe.' + key, on ? '1' : '0'); } catch (e) { /* private window */ } }
const opt = {think: load('think', false)};

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
let flipView = null;  // null = 跟着阵营自动转（执黑时黑在下），true/false = 用户手动锁定
const autoFlipped = () => !!S && S.human === 'black';
const flipped = () => (flipView === null ? autoFlipped() : flipView);
function xy(sq) {
  const f = sq % 9, r = Math.floor(sq / 9), fl = flipped();
  return [MX + (fl ? 8 - f : f) * CELL, MY + (fl ? r : 9 - r) * CELL];
}
const sqName = sq => 'abcdefghi'[sq % 9] + Math.floor(sq / 9);
const sqOf = name => (name.charCodeAt(1) - 48) * 9 + name.charCodeAt(0) - 97;
const isRed = ch => ch !== '.' && ch === ch.toUpperCase();
const isMine = ch => ch !== '.' && !!S && (S.human === 'red') === isRed(ch);
function glyph(kind, red) { return ZH[red ? kind.toUpperCase() : kind.toLowerCase()]; }

let gGrid, gMarks, gPieces, gHits;
const hitTitle = [];  // tooltip of each point (the click targets lie above the pieces)
function drawStatic() {
  svg.textContent = '';
  el('rect', {x: 0, y: 0, width: W, height: H, rx: 10, fill: 'var(--wood)'}, svg);
  el('rect', {x: 6, y: 6, width: W - 12, height: H - 12, rx: 7, fill: 'none', stroke: 'var(--wood-edge)', 'stroke-width': 2}, svg);
  gGrid = el('g', {class: 'grid'}, svg);
  const X = f => MX + f * CELL, Y = r => MY + r * CELL;  // screen grid, independent of orientation
  for (let r = 0; r < 10; ++r) el('line', {x1: X(0), y1: Y(r), x2: X(8), y2: Y(r)}, gGrid);
  for (let f = 0; f < 9; ++f) {
    if (f === 0 || f === 8) el('line', {x1: X(f), y1: Y(0), x2: X(f), y2: Y(9)}, gGrid);
    else { el('line', {x1: X(f), y1: Y(0), x2: X(f), y2: Y(4)}, gGrid); el('line', {x1: X(f), y1: Y(5), x2: X(f), y2: Y(9)}, gGrid); }
  }
  for (const r0 of [0, 7]) {
    el('line', {x1: X(3), y1: Y(r0), x2: X(5), y2: Y(r0 + 2)}, gGrid);
    el('line', {x1: X(5), y1: Y(r0), x2: X(3), y2: Y(r0 + 2)}, gGrid);
  }
  el('text', {x: X(4), y: Y(4.5), class: 'river', 'text-anchor': 'middle', 'dominant-baseline': 'central'}, svg).textContent = '楚河　漢界';
  for (let f = 0; f < 9; ++f) {
    const name = 'abcdefghi'[flipped() ? 8 - f : f];
    el('text', {x: X(f), y: Y(9) + 44, class: 'coord', 'text-anchor': 'middle'}, svg).textContent = name;
  }
  for (let r = 0; r < 10; ++r) {
    el('text', {x: 13, y: Y(r) + 4, class: 'coord', 'text-anchor': 'middle'}, svg).textContent = flipped() ? r : 9 - r;
  }
  gMarks = el('g', {}, svg);
  gPieces = el('g', {}, svg);
  gHits = el('g', {}, svg);
  for (let sq = 0; sq < 90; ++sq) {
    const [x, y] = xy(sq);
    const h = el('circle', {cx: x, cy: y, r: 29, class: 'hit'}, gHits);
    hitTitle[sq] = el('title', {}, h);
    h.addEventListener('click', () => onSquare(sq));
  }
}

function renderBoard() {
  gMarks.textContent = ''; gPieces.textContent = '';
  const board = edit ? edit.board : (S && !S.none ? S.board : null);
  if (!board) return;
  if (!edit && S.moves.length) {
    const last = S.moves[S.moves.length - 1].m;
    for (const name of [last.slice(0, 2), last.slice(2)]) {
      const [x, y] = xy(sqOf(name));
      el('rect', {x: x - 29, y: y - 29, width: 58, height: 58, rx: 8, class: 'mark-last'}, gMarks);
    }
  }
  // 等指定「被吃掉的暗子」时，把被吃的那一格圈出来
  if (!edit && S.pending_cap && S.pending_cap.mv && S.pending_cap.mv.length >= 4) {
    const [cx, cy] = xy(sqOf(S.pending_cap.mv.slice(2, 4)));
    el('rect', {x: cx - 29, y: cy - 29, width: 58, height: 58, rx: 8, class: 'mark-pend'}, gMarks);
  }
  // jqe 这步棋还没落子（等你说它翻开什么），先把它要走的位置标出来
  if (!edit && S.pending && S.pending.from && S.pending.to) {
    const [x1, y1] = xy(sqOf(S.pending.from));
    const [x2, y2] = xy(sqOf(S.pending.to));
    el('line', {x1, y1, x2, y2, class: 'mark-pend-line'}, gMarks);
    for (const [x, y] of [[x1, y1], [x2, y2]]) el('rect', {x: x - 29, y: y - 29, width: 58, height: 58, rx: 8, class: 'mark-pend'}, gMarks);
  }
  let checked = -1;
  if (!edit && S.check) checked = board.indexOf(S.turn === 'red' ? 'K' : 'k');
  for (let sq = 0; sq < 90; ++sq) {
    const ch = board[sq];
    hitTitle[sq].textContent = sqName(sq);
    if (ch === '.') continue;
    const red = isRed(ch), down = ch === 'X' || ch === 'x';
    const [x, y] = xy(sq);
    const g = el('g', {class: 'pc ' + (red ? 'red' : 'black') + (down ? ' down' : '') +
                       (!edit && sq === sel ? ' sel' : '') + (sq === checked ? ' checked' : ''), transform: `translate(${x},${y})`}, gPieces);
    el('circle', {class: 'body', r: 26}, g);
    el('circle', {class: 'ring', r: 21}, g);
    const t = el('text', {x: 0, y: 1}, g);
    if (!down) t.textContent = glyph(ch, red);
    else if (!edit && S.over && S.truth) t.textContent = glyph(S.truth[sq], red);  // shown face-down, identity revealed after the game
    hitTitle[sq].textContent = (red ? '红 ' : '黑 ') + (down ? '暗子' + (!edit && S.over && S.truth ? '（' + NAME[S.truth[sq].toUpperCase()] + '）' : '') : NAME[ch.toUpperCase()]) + ' @ ' + sqName(sq);
  }
  if (!edit && sel !== null) for (const mv of S.legal) {
    if (sqOf(mv.slice(0, 2)) !== sel) continue;
    const to = sqOf(mv.slice(2)), [x, y] = xy(to);
    if (S.board[to] === '.') el('circle', {cx: x, cy: y, r: 8, class: 'target'}, gMarks);
    else el('circle', {cx: x, cy: y, r: 29, class: 'target cap'}, gPieces);
  }
}

function fmtClock(ms) {
  const neg = ms < 0; ms = Math.abs(ms);
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  let t = h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`;
  if (!h && s < 20) t += '.' + Math.floor(ms % 1000 / 100);
  return (neg ? '−' : '') + t;
}

/* ---------- 摆棋：自定义初始局面 ---------- */
const INV = {R: 2, N: 2, B: 2, A: 2, C: 2, P: 5};
const KNAME = {R: '俥', N: '傌', B: '相', A: '仕', C: '炮', P: '兵'};
const PALETTE_RED = [['K', '帅'], ['A', '仕'], ['B', '相'], ['R', '俥'], ['N', '傌'], ['C', '炮'], ['P', '兵'],
                     ['X', '暗·红']];
const PALETTE_BLACK = [['k', '将'], ['a', '士'], ['b', '象'], ['r', '車'], ['n', '馬'], ['c', '砲'], ['p', '卒'],
                       ['x', '暗·黑']];
const START_FEN_BOARD = 'xxxxkxxxx/9/1x5x1/x1x1x1x1x/9/9/X1X1X1X1X/1X5X1/9/XXXXKXXXX';
const POOL_ORDER = ['R', 'A', 'C', 'P', 'N', 'B'];
// 暗子只能落在开局位置：红 = rank0 车马相仕(帅)仕相马车 + b2/h2 炮 + rank3 五个兵
const RED_POINTS = new Set([0, 1, 2, 3, 5, 6, 7, 8, 19, 25, 27, 29, 31, 33, 35]);
const BLACK_POINTS = new Set([81, 82, 83, 84, 86, 87, 88, 89, 64, 70, 54, 56, 58, 60, 62]);
let edit = null;

function expandFenBoard(field) {
  const rows = [];
  for (const rank of field.split('/')) {
    const row = [];
    for (const ch of rank) {
      if (ch >= '1' && ch <= '9') for (let i = 0; i < +ch; ++i) row.push('.');
      else row.push(ch);
    }
    rows.push(row);
  }
  // FEN 第一行是 rank 9，内部按 rank 0（红方底线）打头
  return [].concat(...rows.reverse()).join('');
}

function boardRows(flat) {
  const rows = [];
  for (let r = 9; r >= 0; --r) {
    let out = '', run = 0;
    for (const ch of flat.slice(r * 9, r * 9 + 9)) {
      if (ch === '.') { run++; continue; }
      if (run) { out += run; run = 0; }
      out += ch;
    }
    if (run) out += run;
    rows.push(out || '9');
  }
  return rows.join('/');
}

// 池子 = 每方完整编制 − 明摆出来的子。被删掉的暗子**不从这里扣**：池子可以比盘上的暗子多，
// 多出来的那几颗正是「删掉的那些、身份没定」的——发牌时只发 hidden 颗，剩下的永远不出场。
// 这样删一颗暗子既不会替你决定它是谁，也不会锁死你后面能翻出什么。
function fillPool(hidden, used) {
  const KINDS = ['R', 'N', 'B', 'A', 'C', 'P'];
  const left = {};
  let total = 0;
  for (const k of KINDS) {
    left[k] = Math.max(0, INV[k] - (used[k] || 0));
    total += left[k];
  }
  if (total < hidden) throw new Error('暗子摆得太多了：每方最多 2 车 2 马 2 炮 2 士 2 象 5 兵（明摆的也算在内）');
  return left;
}

function fenOfEdit() {
  const hidden = {red: 0, black: 0}, used = {red: {}, black: {}};
  for (const ch of edit.board) {
    if (ch === 'X') { hidden.red++; continue; }
    if (ch === 'x') { hidden.black++; continue; }
    if (ch === '.') continue;
    const side = ch === ch.toUpperCase() ? 'red' : 'black', k = ch.toUpperCase();
    if (k !== 'K') used[side][k] = (used[side][k] || 0) + 1;
  }
  // 明摆的子也不能超过编制（不然会出现 3 辆车这种局面，池子那边对不上）
  for (const [side, label] of [['red', '红方'], ['black', '黑方']]) {
    for (const k of ['R', 'N', 'B', 'A', 'C', 'P']) {
      const n = used[side][k] || 0;
      if (n > INV[k]) throw new Error(`${label}摆明了 ${n} 个${KNAME[k]}，最多 ${INV[k]} 个`);
    }
  }
  const pool = {red: fillPool(hidden.red, used.red), black: fillPool(hidden.black, used.black)};
  const str = ['red', 'black'].map(s => POOL_ORDER.map(k =>
    pool[s][k] ? (s === 'black' ? k.toLowerCase() : k) + pool[s][k] : '').join('')).join('');
  return boardRows(edit.board.join('')) + ' ' + $('edit-turn').value + ' ' + (str || '-') + ' 0 1';
}

function refreshFen() {
  try { $('fen').value = fenOfEdit(); $('edithint').textContent = '当前局面：' + $('fen').value; $('edithint').className = 'hint'; }
  catch (e) { $('edithint').textContent = e.message; $('edithint').className = 'hint warn'; }
}

function drawPalette() {
  const g = $('palette-grid');
  g.textContent = '';
  const button = (ch, label, extra) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    let cls = ch === '.' ? 'erase' : (ch === ch.toUpperCase() ? 'red' : 'black');
    if (ch === 'X' || ch === 'x') cls += ' dark';
    if (extra) cls += ' ' + extra;
    if (edit && edit.brush === ch) cls += ' on';
    b.className = cls;
    b.addEventListener('click', () => { if (edit) { edit.brush = ch; drawPalette(); } });
    return b;
  };
  // 红方一行、黑方一行，删除棋子单独一行（比棋子按钮大一号）
  for (const row of [PALETTE_RED, PALETTE_BLACK]) {
    const d = document.createElement('div');
    d.className = 'prow';
    for (const [ch, label] of row) d.appendChild(button(ch, label));
    g.appendChild(d);
  }
  const d = document.createElement('div');
  d.className = 'prow';
  d.appendChild(button('.', '删除棋子', 'big'));
  g.appendChild(d);
}

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && sel !== null) { sel = null; renderBoard(); }
  if ((ev.key === 'f' || ev.key === 'F') && !dlg.open && pickDlg.hidden && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    ev.preventDefault();
    toggleFlip();
  }
  if ((ev.key === 'u' || ev.key === 'U') && !dlg.open && pickDlg.hidden && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    ev.preventDefault();
    undoMove();
  }
});

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function loop() {
  for (;;) {
    try {
      const r = await fetch('/api/state?v=' + (S ? S.v : 0), {cache: 'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const s = await r.json();
      const fresh = !S || s.id !== S.id || !!s.none !== !!S.none;
      S = s; recvAt = performance.now();
      if (fresh) { sel = null; shownMoves = -1; drawStatic(); renderBoard(); syncFlipLabel(); }
      // 上一局遗留的「这颗暗子翻成什么」问句：换局或问题已解决就收掉卡片
      if (pick) {
        const still = pick.mode === 'reveal' ? !!S.pending
          : pick.mode === 'capture' ? !!S.pending_cap
            : true;                        // move：你自己还没答，保持
        if (fresh || !still) {
          pick = null;
          pickDlg.hidden = true;
          renderBoard();
        }
      }
      if (S.none || S.over || S.turn !== S.human) sel = null;
      render();
      if (!pick && pickDlg.hidden) {
        if (S.pending) openPick('reveal');
        else if (S.pending_cap) openPick('capture');
      }
      if (S.none && !dlg.open && !edit && autoDialog) openDialog();
    } catch (e) {
      $('status').textContent = '本地服务没有响应…';
      await sleep(1500);
    }
  }
}
drawStatic();
syncFlipLabel();
setInterval(renderClocks, 200);
loop();
</script>
